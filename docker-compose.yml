# iMessage on Matrix: Synapse + the rustpush bridge + Postgres.
#
# Run ./setup.sh once before the first `docker compose up -d`; it writes .env and everything
# under data/ (secrets, generated configs). Nothing secret lives in this repository.
#
# Only Synapse is reachable from outside the stack, and only through the homelab Caddy on the
# external home_default network (matrix.brensch.com, LAN + WireGuard only). No ports are published.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: imessage-postgres
    restart: unless-stopped
    user: "${UID}:${GID}"
    environment:
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      # Synapse refuses a database whose collation isn't C.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "matrix", "-d", "synapse"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *logging

  synapse:
    image: matrixdotorg/synapse:v1.164.1
    container_name: imessage-synapse
    restart: unless-stopped
    command:
      - run
      - --config-path=/config/homeserver.yaml
      - --config-path=/data/secrets.yaml
    environment:
      UID: ${UID}
      GID: ${GID}
      TZ: America/Los_Angeles
    volumes:
      - ./synapse:/config:ro
      - ./data/synapse:/data
      - ./data/bridge/registration.yaml:/appservices/imessage.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - home_default
    logging: *logging

  bridge:
    # Built locally by bridge/build.sh: upstream at a pinned commit plus bridge/*.patch.
    image: imassage-bridge:595ce7e-mac
    container_name: imessage-bridge
    restart: unless-stopped
    user: "${UID}:${GID}"
    environment:
      XDG_DATA_HOME: /state
      HOME: /state
      TZ: America/Los_Angeles
      # Anisette from the Mac mini's AOSKit (mac-anisette/), not the public servers.
      ANISETTE_MAC_URL: ${ANISETTE_MAC_URL}
      ANISETTE_MAC_TOKEN: ${ANISETTE_MAC_TOKEN}
    volumes:
      - ./data/bridge:/data
      - ./data/bridge-state:/state
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    networks:
      - internal
    logging: *logging

networks:
  internal:
  home_default:
    external: true
